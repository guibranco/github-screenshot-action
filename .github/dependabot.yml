version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 10
    ignore:
      # ts-jest 29.x declares `typescript@">=4.3 <7"` as a peer dependency, so
      # bumping to TypeScript 7 (the native compiler) makes `npm ci` fail with
      # ERESOLVE (see #164). Drop this once a ts-jest release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      puppeteer:
        patterns:
          - "puppeteer*"
      actions-toolkit:
        patterns:
          - "@actions/*"
      typescript:
        patterns:
          - "typescript"
          - "ts-node"
          - "ts-jest"
          - "@types/*"
    labels:
      - "📦 dependencies"
      - "npm"
    commit-message:
      prefix: "chore(npm)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    labels:
      - "📦 dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 10
    groups:
      actions-core:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
      gittools:
        patterns:
          - "gittools/*"
    labels:
      - "📦 dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
